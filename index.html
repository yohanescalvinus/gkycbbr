<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Data Excel</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS untuk handling Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome untuk icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-file-excel"></i> Editor Data Excel</h1>
            <p>Edit data dan export kembali ke format Excel</p>
        </header>

        <div class="control-panel">
            <div class="file-upload">
                <input type="file" id="excelFile" accept=".xlsx, .xls" hidden>
                <button id="uploadBtn" class="btn btn-primary">
                    <i class="fas fa-upload"></i> Upload Excel
                </button>
                <span id="fileName">Belum ada file dipilih</span>
            </div>
            
            <div class="action-buttons">
                <button id="addRowBtn" class="btn btn-success" disabled>
                    <i class="fas fa-plus"></i> Tambah Baris
                </button>
                <button id="exportBtn" class="btn btn-export" disabled>
                    <i class="fas fa-download"></i> Export ke Excel
                </button>
                <button id="saveTemplateBtn" class="btn btn-secondary">
                    <i class="fas fa-file-download"></i> Download Template
                </button>
            </div>
        </div>

        <div class="data-info">
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <span id="rowCount">0 data</span>
            </div>
            <div class="field-info">
                <strong>Field:</strong> Foto, Nama, Alamat, Tanggal Lahir
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th width="50">No</th>
                        <th width="150">Foto</th>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th width="150">Tanggal Lahir</th>
                        <th width="100">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan diisi oleh JavaScript -->
                    <tr class="empty-row">
                        <td colspan="6">
                            <i class="fas fa-file-excel"></i>
                            <p>Upload file Excel untuk mulai mengedit data</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Preview Foto Modal -->
        <div id="imageModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Preview Foto</h3>
                <div id="imagePreview"></div>
                <input type="file" id="imageUpload" accept="image/*" hidden>
                <button id="changeImageBtn" class="btn btn-primary">
                    <i class="fas fa-camera"></i> Ganti Foto
                </button>
            </div>
        </div>

        <footer>
            <p>© 2024 Editor Excel - Data tersimpan di browser Anda</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
